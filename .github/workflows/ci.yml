name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang-format's built-in Webkit style drifts between versions, so pin
      # the one this codebase is formatted with, via the official PyPI wheels
      - name: Install clang-format (pinned to 21.1)
        run: pipx install 'clang-format==21.1.*'

      - name: Check formatting
        run: make clang-format-check

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends ccache libyaml-cpp-dev libgtest-dev

      - name: Build shared library
        run: make fcp-cpp.so

      - name: Run tests
        run: make test
